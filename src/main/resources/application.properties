# ===== PRODUCTION CONFIGURATION =====
# Railway provides PORT environment variable
server.port=${PORT:8080}

# Database configuration - Railway will provide these via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Outpass_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.example.Employee_OutPass_Project=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson date format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC